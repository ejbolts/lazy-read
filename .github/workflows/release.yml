name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: dotnet run --project tests/LazyRead.Checks -c Release
      - run: python -m unittest discover -s engine/tests
      - name: Package
        shell: pwsh
        run: |
          $package = 'package/LazyRead'
          dotnet publish src/LazyRead/LazyRead.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "$package/app"
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          New-Item -ItemType Directory -Force "$package/engine" | Out-Null
          Copy-Item engine/*.py, engine/requirements.txt "$package/engine"
          Copy-Item Setup.ps1, Launch.ps1, 'Start Lazy Read.cmd', README.md, LICENSE $package
          Compress-Archive -Path $package -DestinationPath package/LazyRead-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LazyRead-win-x64
          path: package/LazyRead-win-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" package/LazyRead-win-x64.zip --title "Lazy Read ${{ github.ref_name }}" --generate-notes
